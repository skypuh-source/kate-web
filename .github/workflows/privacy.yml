name: privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository scope
        run: sh scripts/check_scope.sh
      - name: Check personal data
        run: sh scripts/check_privacy.sh
